<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio d'Enrique</title>
    <!--
      GitHub Pages has no server-side routing, so a direct load of /my-portfolio/about
      lands here. This encodes the requested path into a query string and bounces to
      index.html, which restores the real URL before React Router boots.
      pathSegmentsToKeep = 1 because the site is served from the /my-portfolio/ subpath.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/portafolio.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Portfolio d'Andres Enrique Ortiz Santa Cruz, développeur Full-Stack orienté Backend basé à Paris."
    />

    <!-- Link previews (LinkedIn, WhatsApp, Slack…). Crawlers do not run JS, so these
         stay static in French while the page itself adapts to the visitor's language. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://andr3senrique.github.io/my-portfolio/" />
    <meta property="og:title" content="Andres Enrique Ortiz Santa Cruz — Développeur Full-Stack" />
    <meta
      property="og:description"
      content="Développeur Full-Stack orienté Backend basé à Paris. TypeScript, Node.js, NestJS, React."
    />
    <meta property="og:image" content="https://andr3senrique.github.io/my-portfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Andres Enrique Ortiz Santa Cruz — Développeur Full-Stack" />
    <meta
      name="twitter:description"
      content="Développeur Full-Stack orienté Backend basé à Paris. TypeScript, Node.js, NestJS, React."
    />
    <meta name="twitter:image" content="https://andr3senrique.github.io/my-portfolio/og-image.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Enrique's portfolio</title>

    <!-- Restores the path that 404.html encoded, before React Router reads the URL. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
